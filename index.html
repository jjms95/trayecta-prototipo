<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trayecta · Prototipo navegable (Grupo 1 · Usabilidad)</title>
<style>
:root{--p:#0B6E4F;--p2:#12A37A;--pl:#E3F4EE;--ink:#14211C;--mut:#6B7A74;--line:#E4EAE7;--bg:#F5F8F7;--red:#D64545;--amb:#E8A317;--blue:#2F6FED}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%}
body{background:linear-gradient(135deg,#0b3d2e,#0B6E4F 55%,#1c8f6b);display:flex;align-items:center;justify-content:center;gap:40px;color:var(--ink);min-height:100vh}
.side{color:#e8f6f0;max-width:280px;font-size:14px;line-height:1.5}
.side h1{font-size:26px;margin-bottom:8px}.side a{color:#fff}
.side select{width:100%;padding:8px;border-radius:8px;margin-top:10px}
.phone{width:390px;height:844px;border-radius:52px;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 0 12px #111,0 0 0 14px #333,0 30px 80px rgba(0,0,0,.5)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.sb{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;z-index:5}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb.dark{color:#fff}
.body{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:8px 22px 24px}
.top{display:flex;align-items:center;gap:10px;padding:6px 16px 10px}
.top h2{font-size:19px;flex:1}
.back{width:38px;height:38px;border-radius:50%;border:none;background:var(--bg);font-size:20px;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;text-align:center}
.pri{background:var(--p);color:#fff}.sec{background:var(--pl);color:var(--p)}.ghost{background:none;color:var(--p)}
.out{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.danger{background:var(--red);color:#fff}.grey{background:#E9EDEB;color:var(--ink)}
.btn.sm{padding:10px;font-size:14px;margin-top:0}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.in{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:#fff;color:var(--ink)}
.in.focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
.div{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0 4px}.div:before,.div:after{content:"";flex:1;height:1px;background:var(--line)}
.g{display:flex;align-items:center;justify-content:center;gap:10px}
.link{color:var(--p);font-weight:600;cursor:pointer;font-size:14px;background:none;border:none}
.center{text-align:center}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(10,40,30,.1);padding:14px}
.list .it{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.av{width:42px;height:42px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.it b{display:block;font-size:15px}.it small{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chip{flex:none;padding:8px 13px;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent}
.chip.on{background:var(--p);color:#fff}
.chip.o{box-shadow:none;border-color:var(--line)}
.nav{height:82px;flex:none;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:8px;background:#fff;z-index:5}
.nav div{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);cursor:pointer;gap:3px;font-weight:600;width:90px}
.nav div span{font-size:22px;filter:grayscale(1);opacity:.6}
.nav .on{color:var(--p)}.nav .on span{filter:none;opacity:1}
.nav .on span{background:var(--pl);border-radius:14px;padding:0 16px}
.map{position:absolute;inset:0}
.map svg{width:100%;height:100%;display:block}
.search{position:absolute;left:14px;right:14px;top:4px;z-index:3}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 3px 14px rgba(0,0,0,.16);font-size:15px;color:var(--mut);cursor:pointer}
.sbox .avt{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.fab{position:absolute;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;z-index:3;border:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.14);padding:10px 20px 18px;z-index:4}
.grab{width:40px;height:5px;border-radius:3px;background:#D5DDD9;margin:0 auto 12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}
.ok{background:#E3F4EE;color:var(--p)}.warn{background:#FFF3DA;color:#9A6A00}.bad{background:#FDE7E7;color:var(--red)}.info{background:#E8EFFE;color:var(--blue)}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.tabs div{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs .on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.route{border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-top:10px;cursor:pointer}
.route.sel{border-color:var(--p);background:#F4FBF8}
.route .t{font-size:21px;font-weight:800}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.tog{width:48px;height:28px;border-radius:14px;background:#CBD3CF;position:relative;flex:none;cursor:pointer}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:var(--p)}.tog.on:after{left:23px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .tx{flex:1}.row .tx b{display:block;font-size:15px}.row .tx small{color:var(--mut);font-size:12.5px}
.turn{position:absolute;top:0;left:0;right:0;background:var(--p);color:#fff;padding:52px 20px 16px;z-index:4;border-radius:0 0 22px 22px}
.turn .big{font-size:26px;font-weight:800;display:flex;align-items:center;gap:14px}
.turn .arrow{font-size:40px;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.inc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.inc div{border:1.5px solid var(--line);border-radius:16px;padding:14px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.inc div span{display:block;font-size:30px;margin-bottom:4px}
.inc .on{border-color:var(--p);background:var(--pl);color:var(--p)}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:#14211C;color:#fff;padding:14px 16px;border-radius:14px;font-size:14px;z-index:20;display:flex;gap:10px;align-items:center;animation:in .3s}
.modal{position:absolute;inset:0;background:rgba(10,25,20,.45);z-index:15;display:flex;align-items:center;justify-content:center;padding:28px}
.modal .card{width:100%;padding:22px}
.photos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.photos div{flex:none;width:120px;height:90px;border-radius:12px;background:linear-gradient(135deg,#9fd8c2,#3d9c7a);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:11px;font-weight:600}
.acts{display:flex;justify-content:space-between;margin:14px 0}
.acts div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--p);cursor:pointer;width:70px}
.acts div span{width:46px;height:46px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:19px}
.acts .main span{background:var(--p);color:#fff}
.stars{color:#E8A317}
.dev{position:absolute;top:50px;right:12px;z-index:30;background:rgba(20,33,28,.85);color:#9ff0cf;font:600 10.5px/1.3 ui-monospace,monospace;padding:5px 8px;border-radius:8px;max-width:220px;text-align:right;display:none}
body.devon .dev{display:block}
.devbtn{position:absolute;bottom:88px;right:10px;z-index:31;font:700 11px ui-monospace,monospace;background:rgba(11,110,79,.12);color:var(--p);border:1px solid rgba(11,110,79,.3);border-radius:10px;padding:3px 7px;cursor:pointer}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:40}
.logo{width:88px;height:88px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h3{font-size:16px;margin:16px 0 4px}
p.m{color:var(--mut);font-size:14px;line-height:1.45}
.radio{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-top:10px;cursor:pointer}
.radio.on{border-color:var(--p);background:#F4FBF8}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #AAB6B1;flex:none}
.radio.on i{border:6px solid var(--p)}
.check{width:22px;height:22px;border-radius:6px;border:2px solid #AAB6B1;flex:none}
.check.on{background:var(--p);border-color:var(--p);position:relative}.check.on:after{content:"✓";color:#fff;position:absolute;left:3px;top:-2px;font-size:14px;font-weight:800}
/* print mode: one screen per page */
body.print{background:#fff;display:block}
body.print .side,body.print .devbtn{display:none}
body.print .phone{width:430px;height:932px;border-radius:0;box-shadow:none}
body.print .screen{animation:none}
@page{size:430pt 932pt;margin:0}
body.print .phone{zoom:1.3333}
</style></head>
<body>
<div class="side" id="side">
<h1>Trayecta</h1>
<p>Prototipo navegable · Usabilidad – Parcial 2<br>Grupo 1 · Universidad del Quindío<br><small>(nombre provisional)</small></p>
<p style="margin-top:12px">Toca los botones dentro del teléfono para navegar. Pulsa <b>?</b> (o el botón «RQ» del teléfono) para ver el ID de pantalla y los requisitos que cubre.</p>
<select id="jump" onchange="go(this.value)"></select>
</div>
<div class="phone" id="phone"></div>
<script>
const $=s=>document.querySelector(s);
const state={mode:'Auto',route:0,inc:null,fav:'Guardados',voice:true,res:'Lista'};
const SB=(dark)=>`<div class="sb ${dark?'dark':''}"><span>9:41</span><span class="ic">▂▄▆ <span style="font-size:13px">5G</span> <svg width="26" height="13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>`;
const NAV=(t)=>`<div class="nav">${[['s009','🧭','Explorar'],['s025','⭐','Favoritos'],['s029','👤','Perfil']].map(([id,i,l])=>`<div class="${t==l?'on':''}" onclick="go('${id}')"><span>${i}</span>${l}</div>`).join('')}</div>`;
const TOP=(t,b='back()',extra='')=>`<div class="top"><button class="back" onclick="${b}">‹</button><h2>${t}</h2>${extra}</div>`;
const LOGO=`<svg width="56" height="56" viewBox="0 0 56 56"><path d="M28 4c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30C46 12 38 4 28 4z" fill="#0B6E4F"/><path d="M19 27l7-12 4 7 3-4 5 9" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// Stylized map of Armenia, Quindío (fictional geometry)
function MAP(o={}){const r=o.route;return `<div class="map"><svg viewBox="0 0 390 760" preserveAspectRatio="xMidYMid slice">
<rect width="390" height="760" fill="#EEF1EC"/>
<path d="M-20 520 C60 480 120 560 200 520 S330 430 420 470 L420 560 C330 520 270 600 200 610 S60 560 -20 610Z" fill="#D7EBDD"/>
<rect x="232" y="150" width="120" height="90" rx="14" fill="#CFE8D4"/><text x="292" y="200" font-size="10" fill="#4C8B62" text-anchor="middle" font-weight="600">Parque de la Vida</text>
<rect x="30" y="300" width="80" height="70" rx="10" fill="#CFE8D4"/><text x="70" y="340" font-size="9" fill="#4C8B62" text-anchor="middle" font-weight="600">Plaza de Bolívar</text>
<path d="M-10 600 C80 560 150 640 230 590 S360 520 400 560" stroke="#A9D3F0" stroke-width="10" fill="none"/>
<g stroke="#fff" stroke-linecap="round">
<path d="M-10 120 L400 90" stroke-width="10"/><path d="M-10 270 L400 250" stroke-width="16"/><path d="M-10 420 L400 400" stroke-width="10"/><path d="M-10 690 L400 670" stroke-width="10"/>
<path d="M60 -10 L80 770" stroke-width="10"/><path d="M180 -10 L195 770" stroke-width="18"/><path d="M300 -10 L320 770" stroke-width="10"/>
<path d="M-10 40 L400 520" stroke-width="13"/>
<g stroke-width="5" opacity=".9"><path d="M-10 190 L400 170"/><path d="M-10 345 L400 325"/><path d="M-10 500 L400 480"/><path d="M120 -10 L138 770"/><path d="M240 -10 L258 770"/><path d="M360 -10 L378 770"/></g>
</g>
<path d="M180 -10 L195 770" stroke="#FFD66B" stroke-width="5" opacity=".8"/>
<path d="M-10 270 L400 250" stroke="#FFD66B" stroke-width="4" opacity=".7"/>
${o.traffic!==false?`<path d="M187 140 L190 240" stroke="#D64545" stroke-width="6" stroke-linecap="round"/><path d="M190 240 L193 330" stroke="#E8A317" stroke-width="6" stroke-linecap="round"/><path d="M20 268 L120 262" stroke="#12A37A" stroke-width="6" stroke-linecap="round"/><path d="M230 255 L340 250" stroke="#D64545" stroke-width="6" stroke-linecap="round"/>`:''}
<g font-size="10" fill="#7B8781" font-weight="600"><text x="200" y="60" transform="rotate(88 200 60)">Av. Bolívar</text><text x="20" y="262">Calle 21</text><text x="12" y="113">Calle 30</text><text x="80" y="140" transform="rotate(40 80 140)">Av. 19</text><text x="310" y="60" transform="rotate(88 310 60)">Cra. 14</text><text x="16" y="414">Calle 10</text><text x="40" y="560" fill="#4C8B62">Río Quindío</text></g>
${r?`<path d="${r.alt||''}" stroke="#9BB3AA" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${r.d}" stroke="#0B6E4F" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${r.e[0]}" cy="${r.e[1]}" r="9" fill="#fff" stroke="#D64545" stroke-width="5"/>`:''}
${o.pois!==false?`<g font-size="15" text-anchor="middle" style="cursor:pointer">${[['☕',110,215,'s012'],['⛽',270,320,''],['🍴',340,120,''],['🏥',45,460,''],['🎓',260,455,''],['🅿️',150,370,'']].map(([e,x,y,l])=>`<g onclick="go('s012')"><circle cx="${x}" cy="${y}" r="15" fill="#fff" stroke="#0B6E4F" stroke-width="2"/><text x="${x}" y="${y+5}">${e}</text></g>`).join('')}</g>`:''}
${o.incident?`<g><circle cx="190" cy="200" r="15" fill="#E8A317"/><text x="190" y="206" font-size="15" text-anchor="middle">🚧</text></g>`:''}
<circle cx="${o.me?o.me[0]:192}" cy="${o.me?o.me[1]:300}" r="30" fill="#2F6FED" opacity=".15"/><circle cx="${o.me?o.me[0]:192}" cy="${o.me?o.me[1]:300}" r="10" fill="#2F6FED" stroke="#fff" stroke-width="4"/>
</svg></div>`}
const R1={d:'M192 300 L190 250 L320 240 L328 330 L340 470',alt:'M192 300 L195 420 L330 400 L340 470',e:[340,470]};
const RNAV={d:'M192 600 L190 400 L320 380 L330 200',alt:'',e:[330,200]};
const field=(l,v,ph,t='text',f)=>`<label class="f">${l}</label><input class="in ${f?'focus':''}" type="${t}" value="${v||''}" placeholder="${ph||''}">`;

const S={
s001:{t:'Bienvenida',ui:'UI-001',rq:'RQ01, RQ02',h:()=>`<div class="screen" style="background:linear-gradient(170deg,#0B6E4F,#0a4f3a)">${SB(1)}<div class="body" style="display:flex;flex-direction:column;padding:0 26px 40px;color:#fff">
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="logo">${LOGO}</div><h1 style="font-size:36px;margin-top:22px;letter-spacing:-.5px">Trayecta</h1><p style="opacity:.85;margin-top:8px;font-size:16px;line-height:1.5">Llega mejor por Armenia y el Quindío.<br>Tráfico en tiempo real, rutas y alertas.</p></div>
<button class="btn" style="background:#fff;color:var(--p)" onclick="go('s003')">Iniciar sesión</button><button class="btn" style="background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.4)" onclick="go('s002')">Registrarse</button>
<p class="center" style="font-size:12px;opacity:.7;margin-top:18px">Al continuar aceptas los Términos y la Política de privacidad</p></div></div>`},
s002:{t:'Registrarse',ui:'UI-002',rq:'RQ01',h:()=>`<div class="screen">${SB()}${TOP('Crear cuenta')}<div class="body pad" style="padding-top:0">
<p class="m">Guarda tus lugares y preferencias de ruta.</p>
${field('Nombre completo','Laura Gómez')}${field('Correo electrónico','laura.gomez@uqvirtual.edu.co','','email',1)}${field('Contraseña','••••••••','','password')}${field('Confirmar contraseña','••••••••','','password')}
<p style="font-size:12px;color:var(--p);margin-top:8px">✓ Mínimo 8 caracteres · ✓ Las contraseñas coinciden</p>
<button class="btn pri" onclick="go('s006')">Crear cuenta</button><div class="div">o</div>
<button class="btn out g" onclick="go('s006')"><b style="color:#4285F4">G</b> Continuar con Google</button>
<p class="center" style="margin-top:16px;font-size:14px">¿Ya tienes cuenta? <button class="link" onclick="go('s003')">Iniciar sesión</button></p></div></div>`},
s003:{t:'Iniciar sesión',ui:'UI-003',rq:'RQ02',h:()=>`<div class="screen">${SB()}${TOP('Iniciar sesión')}<div class="body pad" style="padding-top:0">
<p class="m">Bienvenido de nuevo 👋</p>
${field('Correo electrónico','laura.gomez@uqvirtual.edu.co','','email')}${field('Contraseña','••••••••','','password',1)}
<p style="text-align:right;margin-top:10px"><button class="link" onclick="go('s004')">¿Olvidaste tu contraseña?</button></p>
<button class="btn pri" onclick="go('s006')">Iniciar sesión</button><div class="div">o</div>
<button class="btn out g" onclick="go('s006')"><b style="color:#4285F4">G</b> Continuar con Google</button>
<p class="center" style="margin-top:16px;font-size:14px">¿No tienes cuenta? <button class="link" onclick="go('s002')">Crear cuenta</button></p></div></div>`},
s004:{t:'Recuperar contraseña',ui:'UI-004',rq:'RQ02 · punto de dolor',h:()=>`<div class="screen">${SB()}${TOP('Recuperar contraseña')}<div class="body pad">
<div class="av" style="width:64px;height:64px;font-size:30px;border-radius:18px">🔑</div><h3>¿Olvidaste tu contraseña?</h3><p class="m">Te enviaremos un código de 6 dígitos a tu correo para restablecerla.</p>
${field('Correo electrónico','laura.gomez@uqvirtual.edu.co','','email',1)}
<button class="btn pri" onclick="go('s005')">Enviar código</button><button class="btn ghost" onclick="go('s003')">Cancelar</button></div></div>`},
s005:{t:'Verificar código',ui:'UI-005',rq:'RQ02 · punto de dolor',h:()=>`<div class="screen">${SB()}${TOP('Verificar código')}<div class="body pad">
<p class="m">Enviamos un código a <b>laura.gomez@uqvirtual.edu.co</b></p><label class="f">Código</label>
<div style="display:flex;gap:8px">${'482917'.split('').map((c,i)=>`<div class="in center" style="font-size:22px;font-weight:700;padding:12px 0;${i==5?'border-color:var(--p)':''}">${c}</div>`).join('')}</div>
${field('Nueva contraseña','••••••••••','','password')}
<button class="btn pri" onclick="toast('Contraseña restablecida');go('s003')">Restablecer</button><button class="btn ghost">Reenviar código (0:42)</button></div></div>`},
s006:{t:'Permiso de ubicación',ui:'UI-006',rq:'RQ05, RQ45',h:()=>`<div class="screen">${SB()}<div class="body pad" style="display:flex;flex-direction:column">

let hist=[],cur=null;
function go(id,replace){if(!S[id])return;if(cur&&!replace&&cur!==id)hist.push(cur);if(id==='s009'||id==='s023'&&!state.from)state.from=state.from;cur=id;render();if(!PRINT)history.replaceState(null,'','#'+id);$('#jump').value=id}
function back(){const p=hist.pop();if(p){cur=p;render()}else go('s009')}
function render(){const s=S[cur];$('#phone').innerHTML=s.h()+`<div class="dev">${s.ui} · ${s.t}<br>${s.rq}</div><button class="devbtn" onclick="document.body.classList.toggle('devon')">RQ</button><div class="home-ind"></div>`}
function toast(m){if(PRINT)return;setTimeout(()=>{const t=document.createElement('div');t.className='toast';t.innerHTML='✅ '+m;$('#phone').appendChild(t);setTimeout(()=>t.remove(),2200)},60)}
document.addEventListener('keydown',e=>{if(e.key==='?')document.body.classList.toggle('devon')});
$('#jump').innerHTML=Object.entries(S).map(([k,v])=>`<option value="${k}">${v.ui} · ${v.t}</option>`).join('');

if(PRINT){document.body.classList.add('print');['mode','inc','res'].forEach(k=>{if(Q.has(k))state[k]=k=='inc'?+Q.get(k):Q.get(k)});if(Q.has('route'))state.route=+Q.get('route');if(Q.has('dev'))document.body.classList.add('devon')}
